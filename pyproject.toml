[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpsa-neupan"
version = "0.1.0"
requires-python = ">=3.10"
description = "Per-point conformal safety allocation for NeuPAN navigation"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
  {name = "CPSA-NeuPAN contributors"}
]
dependencies = [
  "cvxpylayers",
  "numpy",
  "scipy",
  "rich",
  "dill",
  "gctl==1.2",
  "colorama",
  "scikit-learn",
  "pyyaml",
  "torch>=2.1.0",
  "ecos",
]

[project.optional-dependencies]
irsim = ["ir-sim>=2.4.0"]
all = ["ir-sim>=2.4.0"]

[tool.setuptools.packages.find]
include = ["neupan*"]
