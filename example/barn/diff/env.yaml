world:
  height: 5
  width: 5
  step_time: 0.1
  sample_time: 0.1
  offset: [-2.5, -2.5]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.5, width: 0.4}
    state: [-2.25, 0, 1.57]
    goal: [2.25, 0, 0]
    vel_min: [-2, -3.14]
    vel_max: [2, 3.14]
    goal_threshold: 0.15
    description: barn_robot.png
    plot:
      show_trail: True
      show_goal: False
      show_trajectory: False

    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 5.23598776
        number: 360
        noise: False

obstacle: []
