# BARN planner config for 0.5x0.4m robot
# mpc
receding: 10
step_time: 0.1
ref_speed: 1.0
device: 'cpu'
time_print: False
collision_threshold: 0.05

# robot
robot:
  kinematics: 'diff'
  max_speed: [2, 2]
  max_acce: [2, 3]
  length: 0.5
  width: 0.4

# initial path
ipath:
  waypoints: [[-2.25, 0, 0], [2.25, 0, 0]]
  curve_style: 'line'
  min_radius: 1.0
  loop: False
  arrive_threshold: 0.08
  close_threshold: 0.08
  ind_range: 10
  arrive_index_threshold: 1

# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 360
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1
  dune_checkpoint: 'model/barn_robot/model_5000.pth'

# adjust parameters
adjust:
  q_s: 1.0
  p_u: 1.0
  eta: 15.0
  d_max: 0.5
  d_min: 0.05
