world:
  height: 23
  width: 70
  step_time: 0.1
  sample_time: 0.1
  offset: [-3, 10]
  collision_mode: 'stop'  # 'stop', 'unobstructed', 'reactive'
  control_mode: 'auto'  # 'keyboard', 'auto'


robot:
  - kinematics: {name: 'diff'} 
    shape: {name: 'rectangle', length: 1.6, width: 2.0}
    state: [2, 11.5, 0]
    goal: [65, 11.5, 0] 
    vel_min: [-8, -3.14]
    vel_max: [8, 3.14]
    goal_threshold: 0.3
    description: diff_robot0.png
    plot:
      show_trail: True
      show_goal: False
      show_trajectory: False

    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 3.1415926
        number: 100
        noise: False
      
      
obstacle:
  # Side walls (70m long corridor)
  - number: 2
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 70, width: 2}  # top wall
      - {name: 'rectangle', length: 70, width: 2}  # bottom wall
    state: [[35, 22, 0], [35, 1, 0]]

  # Narrow passage pinch (at x=35, gap ~2.5m)
  - number: 2
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 3, width: 9.5}   # top pinch obstacle
      - {name: 'rectangle', length: 3, width: 9.5}   # bottom pinch obstacle
    state: [[35, 17.5, 0], [35, 5.5, 0]]






  
    
